<style>
/* Trang so sánh: một cảnh, mười cách vẽ. Nền sơn mài tối để mọi phong cách đều nổi; lưới thẻ 1 cột trên điện thoại, 2–3 cột trên máy tính. */
:root{
  --bg:#17100c;--card:#231711;--line:rgba(226,178,74,.26);--ink:#f3e9d4;--dim:#bba98a;--gold:#e2b24a;--gold2:#ffd98a;--son:#c8361f;
  --f-display:"Yeseva One",Georgia,"Times New Roman",serif;--f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:400 15px/1.5 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 90px}
header{max-width:1240px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font:400 clamp(30px,6vw,46px)/1.05 var(--f-display);color:var(--gold2);text-wrap:balance}
.lede{margin:0;max-width:62ch;color:var(--dim);font-size:14px}
.lede b{color:var(--ink);font-weight:600}
#grid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.frame{position:relative;display:block;width:100%;aspect-ratio:3/2;max-width:100%;cursor:zoom-in;background:#0e0a08;outline:none}
.frame:focus-visible{box-shadow:inset 0 0 0 3px var(--gold2)}
.frame canvas{display:block;width:100%;height:100%}
.zoom{position:absolute;right:8px;bottom:8px;padding:3px 8px;border-radius:999px;background:rgba(14,9,6,.7);font:600 11px var(--f-ui);color:var(--ink);pointer-events:none}
.frame.isbig{cursor:default}.frame.isbig .zoom{display:none}
.dmg{position:absolute;transform:translate(-50%,-50%);font:800 18px var(--f-ui);color:#fff3c4;text-shadow:0 0 3px #2a1408,0 2px 0 #2a1408,2px 0 0 #2a1408,-2px 0 0 #2a1408,0 -2px 0 #2a1408;pointer-events:none}
.body{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;flex:1}
.hd{display:flex;align-items:center;gap:10px}
.no{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--son);color:#fbeedd;font:400 15px var(--f-display)}
h2{margin:0;font:400 20px/1.15 var(--f-display);color:var(--ink);flex:1}
.tag{font:700 11px var(--f-ui);color:#1d1410;background:var(--gold);padding:2px 8px;border-radius:999px}
.body p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.5}
dl{margin:2px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;font-size:12.5px}
dt{color:var(--dim)}dd{margin:0;color:var(--ink)}
.pips{display:flex;gap:3px}.pips i{width:16px;height:6px;border-radius:2px;background:rgba(255,255,255,.12)}.pips i.f{background:var(--gold)}
.pick{margin-top:auto;align-self:flex-start;min-height:44px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:linear-gradient(#3a271c,#24170f);color:var(--ink);font:700 14px var(--f-ui);cursor:pointer}
.pick:hover{border-color:var(--gold)}
.pick[aria-pressed="true"]{background:linear-gradient(#e5532f,#a32616);border-color:var(--gold2);color:#fff}
.pick:focus-visible,#bigClose:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#chosen{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(35,23,17,.96);border-top:1px solid var(--gold);text-align:center;font:500 14px/1.4 var(--f-ui)}
#chosen b{color:var(--gold2)}
#big{position:fixed;inset:0;z-index:10;background:rgba(8,5,3,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bigbar{display:flex;align-items:center;gap:12px;width:min(100%,calc((100vh - 120px) * 1.5),1200px)}
#bigTitle{flex:1;margin:0;font:400 22px var(--f-display);color:var(--gold2)}
#bigClose{min-height:44px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:#2a1d16;color:var(--ink);font:700 14px var(--f-ui);cursor:pointer}
#bigStage{width:min(100%,calc((100vh - 120px) * 1.5),1200px)}
#bigStage .frame{border-radius:12px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const dist=(ax,ay,bx,by)=>Math.sqrt(dist2(ax,ay,bx,by));
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);
  return lerp(lerp(a,b,u),lerp(c,d,u),v)}
function fbm(x,y,s){return vnoise(x,y,s)*0.6+vnoise(x*2.1,y*2.1,s+7)*0.3+vnoise(x*4.3,y*4.3,s+13)*0.1}
const fmt=n=>{n=Math.floor(n);if(n>=1e6)return(n/1e6).toFixed(n>=1e7?0:1)+'Tr';if(n>=1e4)return(n/1e3).toFixed(n>=1e5?0:1)+'K';return n.toLocaleString('vi-VN')};

    }
  },
  /* Nhạc nền: ngũ cung, tiếng trống và giai điệu kiểu đàn bầu */
  startMusic(){
    if(this.musicTimer)return;const self=this;
    const scales=[[0,2,5,7,9],[0,3,5,7,10],[0,2,5,7,9],[0,3,5,7,10],[0,2,4,7,9],[0,2,5,7,9]];
    let next=this.ctx.currentTime+0.1;const beat=0.42;
    function sched(){
      if(!self.on)return;const c=self.ctx;
      while(next<c.currentTime+0.6){
        const s=self.step++,bar=s%16,sc=scales[self.mode%6],root=self.mode===5?196:174.6;
        if(bar%4===0)self.drum(next,0.5);if(bar%8===6)self.drum(next,0.25);
        if(bar===0||bar===8){const f=root/2*Math.pow(2,sc[0]/12);self.pad(next,f,beat*7.5)}
        if(Math.random()<(bar%2===0?0.55:0.25)){
          const deg=sc[Math.floor(Math.random()*5)],oct=Math.random()<0.3?2:1;
          const f=root*oct*Math.pow(2,deg/12);self.bau(next,f,beat*(Math.random()<0.3?2:1))}
        next+=beat;
      }
    }
    this.musicTimer=setInterval(sched,150);
  },
  drum(t,v){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+0.25);
    g.gain.setValueAtTime(v*0.9,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);o.connect(g);g.connect(this.musG);o.start(t);o.stop(t+0.4)},
  pad(t,f,d){const c=this.ctx;[1,1.5].forEach(m=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f*m;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.12,t+0.8);g.gain.linearRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(this.musG);o.start(t);o.stop(t+d+0.1)})},
  bau(t,f,d){const c=this.ctx,o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(f*0.94,t);o.frequency.exponentialRampToValueAtTime(f,t+0.09);
    l.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*0.012,t+d*0.6);l.connect(lg);lg.connect(o.frequency);
    if(Math.random()<0.3)o.frequency.exponentialRampToValueAtTime(f*1.06,t+d*0.9);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d*1.4);
    o.connect(g);g.connect(this.musG);o.start(t);l.start(t);o.stop(t+d*1.5);l.stop(t+d*1.5)},
};

/* ============ THẾ GIỚI: TẠO BẢN ĐỒ, VA CHẠM, VẼ ĐỊA HÌNH ============ */
const T=48,MW=64,MH=64;
const TG=0,TP=1,TW=2,TS=3,TF=4,TC=5,TL=6,TB=7; // ground path water shore field cliff wall bridge
function makeWorld(mi){
  const M=MAPS[mi],R=mulberry32(M.seed*7919+3),s=M.seed;
  const W={mi,M,tile:new Uint8Array(MW*MH),solid:new Uint8Array(MW*MH),objs:[],ogrid:Array(MW*MH),reach:new Uint8Array(MW*MH),
    camp:{x:11.5*T,y:56*T},out:{x:13*T,y:38.5*T},arena:{x:54*T,y:9.5*T,r:6.2*T},npcs:[],pathPts:[]};
  for(let i=0;i<W.ogrid.length;i++)W.ogrid[i]=null;
  const id=(x,y)=>y*MW+x, inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
  const setT=(x,y,v)=>{if(inb(x,y))W.tile[id(x,y)]=v};
  const getT=(x,y)=>inb(x,y)?W.tile[id(x,y)]:TC;
  const cx=W.camp.x/T,cy=W.camp.y/T,ax=W.arena.x/T,ay=W.arena.y/T;
  const nearCamp=(x,y,r)=>dist(x+.5,y+.5,cx,cy)<r, nearArena=(x,y,r)=>dist(x+.5,y+.5,ax,ay)<r;

  /* --- đặc trưng địa hình --- */
  if(M.feat==='river'||M.feat==='bigriver'||M.feat==='fields'){
    const wid=M.feat==='bigriver'?3.4:M.feat==='fields'?1.9:2.3;
    const base=M.feat==='bigriver'?31:M.feat==='fields'?40:24;
    for(let x=0;x<MW;x++){
      const yc=base+(M.feat==='bigriver'?0:x*0.25)+Math.sin(x*0.17+s)*4+Math.sin(x*0.07+s*2)*3;
      for(let y=0;y<MH;y++){if(Math.abs(y-yc)<wid+vnoise(x*0.3,y*0.3,s)*1.2)setT(x,y,TW)}
    }
  }
  if(M.feat!=='bigriver'){ // ao hồ
    for(let k=0;k<3;k++){const px=randInt(R,12,52),py=randInt(R,14,50),pr=1.6+R()*2.2;
      for(let y=-5;y<=5;y++)for(let x=-5;x<=5;x++){const d=Math.hypot(x,y)+vnoise((px+x)*0.5,(py+y)*0.5,s+k)*1.4;if(d<pr)setT(px+x,py+y,TW)}}
  }
  if(M.feat==='fields'){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(getT(x,y)===TG&&fbm(x*0.12,y*0.12,s+5)>0.55)setT(x,y,TF)}
  }
  if(M.feat==='spiral'){ // thành xoắn ốc Cổ Loa
    const ox=33,oy=32;
    [[8.5,1.0],[14.5,2.2],[20.5,3.6]].forEach(([rr,g],k)=>{
      for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const d=Math.hypot(x+.5-ox,y+.5-oy);
        if(Math.abs(d-rr)<0.9){const a=Math.atan2(y+.5-oy,x+.5-ox);const gap=Math.abs(angDiff(a,g))<0.28||Math.abs(angDiff(a,g+2.6))<0.22;if(!gap)setT(x,y,TL)}}
    });
  }
  if(M.feat==='pass'||M.feat==='mounds'){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
      const n=fbm(x*0.09,y*0.09,s+3);
      if(M.feat==='pass'&&n>0.56&&getT(x,y)===TG)setT(x,y,TC);
      if(M.feat==='mounds'&&n>0.68&&getT(x,y)===TG)setT(x,y,TC);
    }
  }
  /* viền bản đồ */
  for(let x=0;x<MW;x++){setT(x,0,TC);setT(x,MH-1,TC);if(R()<0.6)setT(x,1,TC);if(R()<0.6)setT(x,MH-2,TC)}
  for(let y=0;y<MH;y++){setT(0,y,TC);setT(MW-1,y,TC);if(R()<0.6)setT(1,y,TC);if(R()<0.6)setT(MW-2,y,TC)}

  /* --- đường mòn từ trại tới đấu trường --- */
  const wps=[[12.9,41],[24+R()*5,36+R()*4],[30+R()*6,30+R()*6],[42+R()*6,18+R()*6],[ax,ay]];
  const pts=catmull(wps,14);W.pathPts=pts.map(p=>({x:p[0]*T,y:p[1]*T}));
  const carve=(pts,w)=>pts.forEach(([px,py])=>{for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++){const tx=Math.floor(px)+x,ty=Math.floor(py)+y;
    if(!inb(tx,ty)||tx<1||ty<1||tx>MW-2||ty>MH-2||inTownT(tx,ty))continue;if(Math.hypot(tx+.5-px,ty+.5-py)<w){const t=getT(tx,ty);setT(tx,ty,t===TW?TB:TP)}}});
  carve(pts,1.35);carve(catmull([[22.6,52.9],[25.5,47],wps[1]],10),1.1);
  /* nhánh rẽ để khám phá */
  for(let b=0;b<3;b++){const p0=pts[Math.floor(pts.length*(0.2+b*0.25))];const ang=R()*TAU;
    const br=catmull([p0,[clamp(p0[0]+Math.cos(ang)*10,4,60),clamp(p0[1]+Math.sin(ang)*10,4,60)],[clamp(p0[0]+Math.cos(ang+0.6)*18,4,60),clamp(p0[1]+Math.sin(ang+0.6)*18,4,60)]],10);
    carve(br,1.0);}
  /* trại & đấu trường: dọn trống */
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(nearCamp(x,y,5.2)||nearArena(x,y,7.2)){const t=getT(x,y);if(t===TC||t===TL||t===TW||t===TF)setT(x,y,TG)}
    if(nearCamp(x,y,3.4))setT(x,y,TP);
  }
  townTiles(W);
  /* bờ */
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){if(getT(x,y)===TG){let w=0;for(let k=0;k<8;k++){const t=getT(x+[1,-1,0,0,1,1,-1,-1][k],y+[0,0,1,-1,1,-1,1,-1][k]);if(t===TW)w++}if(w>0)setT(x,y,TS)}}
  for(let i=0;i<W.tile.length;i++){const t=W.tile[i];W.solid[i]=(t===TW||t===TC||t===TL||t===TV)?1:0}
  townSolid(W);

  /* --- vật thể --- */
  const addObj=(o)=>{W.objs.push(o);const k=id(Math.floor(o.x/T),Math.floor(o.y/T));(W.ogrid[k]||(W.ogrid[k]=[])).push(o)};
  const big=M.deco.filter(d=>OBJ[d]&&OBJ[d].solid),small=M.deco.filter(d=>OBJ[d]&&!OBJ[d].solid);
  for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++){
    const t=getT(x,y);if((x<=TOWN.x1+1&&y>=TOWN.y0-1)||nearArena(x,y,7.6))continue;
    const n=fbm(x*0.11,y*0.11,s+19);
    let pathNear=false;for(let yy=-1;yy<=1&&!pathNear;yy++)for(let xx=-1;xx<=1;xx++){const tt=getT(x+xx,y+yy);if(tt===TP||tt===TB){pathNear=true;break}}
    if(t===TG&&!pathNear&&R()<(n>0.55?0.42:n>0.45?0.12:0.03)&&big.length){
      const k=pick2(R,big);addObj({x:(x+.5+(R()-.5)*0.4)*T,y:(y+.75)*T,k,v:Math.floor(R()*3),cr:OBJ[k].cr,s:0.85+R()*0.35})}
    else if((t===TG||t===TS)&&R()<0.07&&small.length){const k=pick2(R,small);addObj({x:(x+R())*T,y:(y+R())*T,k,v:Math.floor(R()*3),cr:0,s:0.8+R()*0.4})}
    if(t===TW&&M.feat==='bigriver'&&R()<0.13)addObj({x:(x+.5)*T,y:(y+.6)*T,k:'stake',v:0,cr:0,s:0.9+R()*0.3});
  }
  /* Vật thể trại */
  const C=W.camp;
  W.npcs=townNpcs(W);townObjs(W,addObj);
  /* đấu trường: cột đá bao quanh */
  for(let k=0;k<10;k++){const a=k/10*TAU+0.3;const ox=W.arena.x+Math.cos(a)*W.arena.r*1.06,oy=W.arena.y+Math.sin(a)*W.arena.r*1.06;
    const tx=Math.floor(ox/T),ty=Math.floor(oy/T);if(getT(tx,ty)===TP)continue;addObj({x:ox,y:oy,k:'pillar',v:k,cr:16,s:1})}

  /* --- vùng đi được (BFS từ trại) --- */
  const blocked=(x,y)=>{const i=id(x,y);if(W.solid[i])return true;const o=W.ogrid[i];if(o)for(const q of o)if(q.cr>0)return true;return false};
  const q=[id(Math.floor(cx),Math.floor(cy))];W.reach[q[0]]=1;
  while(q.length){const i=q.shift(),x=i%MW,y=(i/MW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=id(nx,ny);if(W.reach[j]||blocked(nx,ny))continue;W.reach[j]=1;q.push(j)}}
  W.walk=new Uint8Array(MW*MH);for(let i=0;i<MW*MH;i++)W.walk[i]=W.reach[i];
  W.walkLocked=W.walk.slice();for(let i=0;i<MW*MH;i++){const x=i%MW,y=(i/MW)|0;if(nearArena(x,y,7.4))W.walkLocked[i]=0}
  W.spawnTiles=[];for(let i=0;i<W.reach.length;i++)if(W.reach[i]){const x=i%MW,y=(i/MW)|0;if(!(x<=TOWN.x1+3&&y>=TOWN.y0-3)&&!nearArena(x,y,8.5))W.spawnTiles.push(i)}
  W.campToArena=dist(C.x,C.y,W.arena.x,W.arena.y);
  W.chunks=new Map();
  W.mini=makeMiniBase(W);
  return W;
}
function randInt(R,a,b){return Math.floor(a+R()*(b-a+1))}
function pick2(R,a){return a[Math.floor(R()*a.length)]}
function catmull(p,steps){const out=[];for(let i=0;i<p.length-1;i++){const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];
  for(let s=0;s<steps;s++){const t=s/steps,t2=t*t,t3=t2*t;
    out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
              0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}
  out.push(p[p.length-1]);return out}

/* ---- va chạm ---- */
function tileAt(W,px,py){const x=Math.floor(px/T),y=Math.floor(py/T);if(x<0||y<0||x>=MW||y>=MH)return TC;return W.tile[y*MW+x]}
function isSolidPt(W,px,py){const x=Math.floor(px/T),y=Math.floor(py/T);if(x<0||y<0||x>=MW||y>=MH)return true;return W.solid[y*MW+x]===1}
function moveEnt(W,e,dx,dy){
  e.x+=dx;resolve(W,e);e.y+=dy;resolve(W,e);
  e.x=clamp(e.x,T,(MW-1)*T);e.y=clamp(e.y,T,(MH-1)*T);
}
function resolve(W,e){
  const r=e.r*0.72,x0=Math.floor((e.x-r)/T),x1=Math.floor((e.x+r)/T),y0=Math.floor((e.y-r)/T),y1=Math.floor((e.y+r)/T);
  for(let ty=y0-1;ty<=y1+1;ty++)for(let tx=x0-1;tx<=x1+1;tx++){
    if(tx<0||ty<0||tx>=MW||ty>=MH)continue;const i=ty*MW+tx;
    if(W.solid[i]&&!(e.fly)){const nx=clamp(e.x,tx*T,tx*T+T),ny=clamp(e.y,ty*T,ty*T+T);let dx=e.x-nx,dy=e.y-ny;const d2=dx*dx+dy*dy;
      if(d2<r*r){if(d2<0.0001){/* bên trong ô: đẩy ra cạnh gần nhất */const cxm=tx*T+T/2,cym=ty*T+T/2;dx=e.x-cxm;dy=e.y-cym;const d=Math.hypot(dx,dy)||1;e.x=cxm+dx/d*(T*0.75+r);e.y=cym+dy/d*(T*0.75+r)}
        else{const d=Math.sqrt(d2);e.x+=dx/d*(r-d);e.y+=dy/d*(r-d)}}}
    const os=W.ogrid[i];if(os)for(const o of os){if(!o.cr)continue;const dx=e.x-o.x,dy=e.y-o.y,rr=o.cr*0.8+r,d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>0.0001){const d=Math.sqrt(d2);e.x+=dx/d*(rr-d);e.y+=dy/d*(rr-d)}}
  }
}

/* ---- bản đồ nhỏ ---- */
function makeMiniBase(W){
  const c=document.createElement('canvas');c.width=MW;c.height=MH;const x=c.getContext('2d');const P=W.M.pal;
  const im=x.createImageData(MW,MH);
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const cols={[TG]:hex(P.g[0]),[TP]:hex(P.path),[TW]:hex(P.water),[TS]:hex(P.shore),[TF]:hex(P.field||P.g[1]),[TC]:hex(P.cliff||'#4a4a40'),[TL]:hex(P.wall||'#7a5a3a'),[TB]:hex('#8a6a44'),[TQ]:hex('#d2c4a0'),[TV]:hex('#8a8272')};
  for(let i=0;i<MW*MH;i++){let c0=cols[W.tile[i]];const o=W.ogrid[i];if(o&&o.some(q=>q.cr>12))c0=hex(P.tree2);if(W.bfoot&&W.bfoot[i])c0=hex('#7a3a2a');
    im.data[i*4]=c0[0]*0.8;im.data[i*4+1]=c0[1]*0.8;im.data[i*4+2]=c0[2]*0.8;im.data[i*4+3]=255}
  x.putImageData(im,0,0);return c;
}

/* ============ VẼ ĐỊA HÌNH (cache theo khối) ============ */
const CHUNK=8;
function getChunk(W,cx,cy,S){
  const key=cx+','+cy;let c=W.chunks.get(key);if(c&&c.S===S)return c;
  c=document.createElement('canvas');const px=CHUNK*T;c.width=Math.ceil(px*S);c.height=Math.ceil(px*S);c.S=S;
  const g=c.getContext('2d');g.scale(S,S);g.translate(-cx*px,-cy*px);drawTerrain(W,g,cx*CHUNK-1,cy*CHUNK-1,cx*CHUNK+CHUNK,cy*CHUNK+CHUNK);
  W.chunks.set(key,c);if(W.chunks.size>64){const k0=W.chunks.keys().next().value;W.chunks.delete(k0)}
  return c;
}
function drawTerrain(W,g,x0,y0,x1,y1){
  const P=W.M.pal,s=W.M.seed;
  const tt=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?TC:inTownT(x,y)?99:W.tile[y*MW+x];
  // lượt 1: nền
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const t=tt(x,y),px=x*T,py=y*T;if(t===99)continue;
    if(t===TW||t===TB){g.fillStyle=P.water;g.fillRect(px,py,T,T);
      g.fillStyle=P.water2;g.globalAlpha=0.25+hash2(x,y,s)*0.2;g.fillRect(px,py+hash2(x,y,s+1)*T*0.7,T,6);g.globalAlpha=1;continue}
    const n=fbm(x*0.18,y*0.18,s+2);g.fillStyle=n>0.58?P.g[1]:n<0.4?P.g[2]:P.g[0];g.fillRect(px-0.5,py-0.5,T+1,T+1);
  }
  // lượt 1b: mảng màu mềm phá lưới ô
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=tt(x,y);if(t===TW||t===TB)continue;
    const h=hash2(x,y,s+9);g.fillStyle=h>0.5?P.g[1]:P.g[2];g.globalAlpha=0.5;
    g.beginPath();g.ellipse(x*T+T*h,y*T+T*hash2(x,y,s+4),T*(0.4+h*0.4),T*(0.3+h*0.3),h*3,0,TAU);g.fill();g.globalAlpha=1}
  // bờ cát
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(tt(x,y)!==TS)continue;g.fillStyle=P.shore;
    g.beginPath();g.arc(x*T+T/2,y*T+T/2,T*0.72,0,TAU);g.fill()}
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(tt(x,y)!==TW)continue;// mép nước tối
    g.fillStyle=P.water;g.beginPath();g.arc(x*T+T/2,y*T+T/2,T*0.62,0,TAU);g.fill()}
  // ruộng
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(tt(x,y)!==TF)continue;const px=x*T,py=y*T;
    g.fillStyle=P.field;g.fillRect(px+2,py+2,T-4,T-4);g.strokeStyle=P.field2;g.lineWidth=2;
    for(let k=0;k<4;k++){g.beginPath();g.moveTo(px+6,py+8+k*11);g.lineTo(px+T-6,py+8+k*11);g.stroke()}
    g.strokeStyle='rgba(60,50,20,0.35)';g.lineWidth=2;g.strokeRect(px+1,py+1,T-2,T-2)}
  // đường
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(tt(x,y)!==TP)continue;g.fillStyle=P.path;g.beginPath();g.arc(x*T+T/2,y*T+T/2,T*0.74,0,TAU);g.fill()}
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(tt(x,y)!==TP)continue;
    for(let k=0;k<4;k++){const h=hash2(x*7+k,y,s+31);g.fillStyle=h>0.5?'rgba(255,240,210,0.25)':'rgba(60,40,20,0.18)';g.beginPath();g.arc(x*T+T*hash2(x,y*3+k,s),y*T+T*hash2(x+k,y,s+5),1.5+h*2.5,0,TAU);g.fill()}}
  // cầu gỗ
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(tt(x,y)!==TB)continue;const px=x*T,py=y*T;
    g.fillStyle='#7a5432';g.fillRect(px-1,py+2,T+2,T-4);g.strokeStyle='#4a301a';g.lineWidth=2;

  // cỏ, hoa nhỏ
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=tt(x,y);if(t!==TG)continue;
    for(let k=0;k<6;k++){const h=hash2(x*13+k,y*7,s+40),hx=x*T+hash2(x,y+k*5,s+41)*T,hy=y*T+hash2(x+k*3,y,s+42)*T;

  drawTownGround(W,g,x0,y0,x1,y1);
  // vách đá / tường thành (nổi khối)
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=tt(x,y);if(t!==TC&&t!==TL)continue;const px=x*T+T/2,py=y*T+T/2;

    g.fillStyle='rgba(0,0,0,0.25)';g.beginPath();g.ellipse(px+4,py+16,T*0.66,T*0.5,0,0,TAU);g.fill();
    g.fillStyle=b;g.beginPath();g.arc(px,py+6,T*0.68,0,TAU);g.fill();

    else{g.fillStyle='rgba(255,255,255,0.12)';g.beginPath();g.arc(px-8,py-10,T*0.25,0,TAU);g.fill()}}
}

/* ---- tìm đường: BFS trên lưới ô ---- */
function bfsField(W,gx,gy,WK){const walk=WK||W.walk;
  const d=new Int16Array(MW*MH).fill(-1);gx=clamp(gx,0,MW-1);gy=clamp(gy,0,MH-1);
  let start=gy*MW+gx;
  if(!walk[start]){let best=-1,bd=1e9;for(let yy=-2;yy<=2;yy++)for(let xx=-2;xx<=2;xx++){const x=gx+xx,y=gy+yy;if(x<0||y<0||x>=MW||y>=MH)continue;const j=y*MW+x;if(walk[j]&&xx*xx+yy*yy<bd){bd=xx*xx+yy*yy;best=j}}if(best<0)return d;start=best}
  const q=new Int32Array(MW*MH);let h=0,t=0;q[t++]=start;d[start]=0;
  while(h<t){const i=q[h++],x=i%MW,y=(i/MW)|0,nd=d[i]+1;
    if(x>0&&d[i-1]<0&&walk[i-1]){d[i-1]=nd;q[t++]=i-1}if(x<MW-1&&d[i+1]<0&&walk[i+1]){d[i+1]=nd;q[t++]=i+1}
    if(y>0&&d[i-MW]<0&&walk[i-MW]){d[i-MW]=nd;q[t++]=i-MW}if(y<MH-1&&d[i+MW]<0&&walk[i+MW]){d[i+MW]=nd;q[t++]=i+MW}}
  return d;
}
function losClear(W,x0,y0,x1,y1,WK){const walk=WK||W.walk;const d=dist(x0,y0,x1,y1),n=Math.ceil(d/14);if(!n)return true;const nx=-(y1-y0)/d*11,ny=(x1-x0)/d*11;
  for(let k=1;k<=n;k++){const x=lerp(x0,x1,k/n),y=lerp(y0,y1,k/n);for(const o of[0,1,-1]){const px=x+nx*o,py=y+ny*o;const i=Math.floor(py/T)*MW+Math.floor(px/T);if(!walk[i])return false}}return true}
/* hướng đi theo trường khoảng cách: trả về [dx,dy] chuẩn hóa hoặc null */
function fieldDir(W,f,x,y){
  const tx=Math.floor(x/T),ty=Math.floor(y/T);let best=-1,bv=1e9;
  const here=f[ty*MW+tx];
  for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){if(!xx&&!yy)continue;const nx=tx+xx,ny=ty+yy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const j=ny*MW+nx;const v=f[j];if(v<0)continue;
    if(xx&&yy&&(!W.walk[ty*MW+nx]||!W.walk[ny*MW+tx]))continue;const c=v+(xx&&yy?0.4:0);if(c<bv){bv=c;best=j}}
  if(best<0||(here>=0&&bv>=here+0.5&&here===0))return null;
  const cx=(best%MW+0.5)*T,cy=(((best/MW)|0)+0.5)*T;const a=Math.atan2(cy-y,cx-x);return[Math.cos(a),Math.sin(a)];
}

  render(card,t,w,h,dpr){if(!card.s3&&!card.no3d)S3.init(card);if(card.no3d){S3.fallback(card,w,h,dpr);return}const s=card.s3;

    const hp=kf(HERO,t),ep=kf(ENEMY,t);S3.pose(s.H,hp,rig(hp,t),1);S3.pose(s.E,ep,rig(ep,t),-1);
    const hk=t-1.24,fl=hk>=0&&hk<.13;for(const m of s.E.mats)m.emissive.setHex(fl?0x888888:0x000000);
    const arr=s.slash.geometry.attributes.position.array;arr.fill(0);let ta=0;
    if(t>=1.05&&t<1.62){ta=t<=1.3?1:Math.max(0,1-(t-1.3)/.32);let n=0;const te=Math.min(t,1.3),ts=Math.max(1.05,te-.085);const pts=TR.filter(q=>q.t<=te&&q.t>=ts);for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];
      const v=[[a.tip],[a.mid],[b.tip],[b.mid]].map(([q])=>[-55+hp.x*0+q[0],-q[1],7]);[v[0],v[1],v[2],v[1],v[3],v[2]].forEach(q=>{arr[n++]=q[0];arr[n++]=q[1];arr[n++]=q[2]})}}
    s.slash.material.opacity=.85*ta;s.slash.geometry.attributes.position.needsUpdate=true;
    const ix=55-ep.x-4,iy=64;s.sparks.forEach((m,i)=>{if(hk<0||hk>.42){m.visible=false;return}m.visible=true;const q=burst(12,51,hk,40,0)[i];m.position.set(ix+q.x,iy-q.y,10+q.r*6);m.rotation.set(hk*10+i,hk*7,0)});
    s.r.render(s.scn,s.cam);
    const dm=card.dmg;if(dm){if(hk>=0&&hk<.95){const v=new s.TH.Vector3(ix+6,iy+22+hk*34,8).project(s.cam);dm.style.left=((v.x+1)/2*w)+'px';dm.style.top=((1-v.y)/2*h)+'px';dm.style.opacity=hk<.7?1:1-(hk-.7)/.25;dm.hidden=false}else dm.hidden=true}},
  fallback(card,w,h,dpr){if(card.fbDone)return;card.fbDone=1;const c=card.canvas;c.width=w*dpr;c.height=h*dpr;const g=c.getContext('2d');if(!g)return;g.scale(dpr,dpr);g.fillStyle='#2a1d16';g.fillRect(0,0,w,h);g.fillStyle='#bba98a';g.font='600 14px system-ui';g.textAlign='center';g.fillText('Máy này không bật được 3D (WebGL)',w/2,h/2)}};

/* ================= DANH MỤC ================= */
const STYLES=[
 {id:1,name:'Hoạt hình vector',now:1,s:sVector,d:'Kiểu đang dùng trong game. Hình khối có viền, tô màu chuyển, sáng sủa và dễ nhìn trên màn nhỏ.',viet:2,light:5,like:'Game mobile phổ thông'},
 {id:2,name:'Pixel 16-bit',s:sPixel,d:'Điểm ảnh to, 16 màu, viền đen một điểm như máy SNES. Hoài cổ, rất rõ nét khi đông quái.',viet:1,light:5,like:'Game thùng, SNES'},
 {id:3,name:'Thủy mặc',s:sInk,d:'Tranh mực trên giấy dó. Gần như đơn sắc, chỉ điểm son đỏ ở khăn, máu và ấn triện. Đậm chất kiếm hiệp.',viet:4,light:4,like:'Phim, truyện kiếm hiệp'},
 {id:4,name:'Tranh Đông Hồ',s:sDongHo,d:'Màu phẳng tươi, viền đen dày như bản khắc gỗ, giấy điệp lấp lánh, in hơi lệch màu. Chưa game nào làm kiểu này.',viet:5,light:5,like:'Tranh dân gian Việt'},

 {id:7,name:'Anime cel',s:sAnime,d:'Màu tươi, đổ bóng một nấc, đầu to, mắt anime, tia tốc độ và ngôi sao va chạm. Bùng nổ, giống game mobile Á Đông.',viet:2,light:4,like:'Game nhập vai mobile'},

];

/* ================= TRANG ================= */
const cards=[];const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function pips(n){let s='';for(let i=1;i<=5;i++)s+=`<i class="${i<=n?'f':''}"></i>`;return s}
function mount(){const grid=document.getElementById('grid');let chosen=null;try{chosen=+localStorage.getItem('dvhk_style')||null}catch(e){}
  STYLES.forEach((st,i)=>{const el=document.createElement('article');el.className='card';el.id='s'+st.id;
    el.innerHTML=`<div class="frame" role="button" tabindex="0" aria-label="Xem to kiểu ${st.id}: ${st.name}"><canvas></canvas>${st.s.three?'<div class="dmg" hidden>128</div>':''}<span class="zoom">Chạm để xem to</span></div>
      <div class="body"><div class="hd"><span class="no">${st.id}</span><h2>${st.name}</h2>${st.now?'<span class="tag">Đang dùng</span>':''}</div><p>${st.d}</p>
      <dl><dt>Chất Việt</dt><dd class="pips">${pips(st.viet)}</dd><dt>Nhẹ máy</dt><dd class="pips">${pips(st.light)}</dd><dt>Gần với</dt><dd>${st.like}</dd></dl>
      <button class="pick" aria-pressed="${chosen===st.id}">${chosen===st.id?'Đã chọn kiểu này':'Chọn kiểu này'}</button></div>`;
    grid.appendChild(el);const frame=el.querySelector('.frame');
    const card={st,style:st.s,el,frame,canvas:el.querySelector('canvas'),dmg:el.querySelector('.dmg'),vis:false,off:i*.23};cards.push(card);
    const open=()=>openBig(card);frame.addEventListener('click',open);frame.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
    el.querySelector('.pick').addEventListener('click',()=>choose(st))});
  if(chosen)showChosen(STYLES.find(s=>s.id===chosen));
  const io=new IntersectionObserver(es=>es.forEach(e=>{const c=cards.find(c=>c.frame===e.target);if(c)c.vis=e.isIntersecting}),{rootMargin:'120px'});cards.forEach(c=>io.observe(c.frame));
  document.getElementById('bigClose').addEventListener('click',closeBig);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBig()});
  requestAnimationFrame(loop)}
function choose(st){try{localStorage.setItem('dvhk_style',st.id)}catch(e){}document.querySelectorAll('.pick').forEach(b=>{const on=b.closest('.card').id==='s'+st.id;b.setAttribute('aria-pressed',on);b.textContent=on?'Đã chọn kiểu này':'Chọn kiểu này'});showChosen(st)}
function showChosen(st){if(!st)return;const b=document.getElementById('chosen');b.innerHTML=`Bạn chọn kiểu <b>${st.id}: ${st.name}</b>. Nhắn cho Claude “chọn kiểu ${st.id}” để áp dụng cho cả game.`;b.hidden=false}
let big=null;
function openBig(card){if(big)return;big=card;const ov=document.getElementById('big');document.getElementById('bigTitle').textContent=`${card.st.id}. ${card.st.name}`;
  card.home=card.frame.parentNode;document.getElementById('bigStage').appendChild(card.frame);card.frame.classList.add('isbig');ov.hidden=false;document.getElementById('bigClose').focus()}
function closeBig(){if(!big)return;const card=big;card.home.insertBefore(card.frame,card.home.firstChild);card.frame.classList.remove('isbig');document.getElementById('big').hidden=true;big=null;card.frame.focus({preventScroll:true})}
function renderCard(card,t){const c=card.canvas,dpr=Math.min(2,window.devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  if(card.style.three){S3.render(card,t,w,h,dpr);return}
  const bw=Math.round(w*dpr),bh=Math.round(h*dpr);if(c.width!==bw||c.height!==bh){c.width=bw;c.height=bh;card.bg=null}
  const g=card.g||(card.g=c.getContext('2d'));const k=bw/VW;
  if(card.style.bg&&!card.bg){const b=mkc(bw,bh),bg=b.getContext('2d');bg.setTransform(k,0,0,k,0,0);card.style.bg(bg,k);card.bg=b}
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,bw,bh);if(card.bg)g.drawImage(card.bg,0,0);
  g.setTransform(k,0,0,k,0,0);g.globalAlpha=1;card.style.draw(g,scene(t,card.style.hs),card,k)}
let first=true;
function loop(ts){requestAnimationFrame(loop);const now=ts/1000;
  for(const c of cards){const isBig=big===c;if(!c.vis&&!isBig&&!first)continue;const t=window.__freeze!=null?window.__freeze:REDUCE&&!isBig?1.28:((now+c.off)%CYC);if(window.__freeze==null&&REDUCE&&!isBig&&c.drawn&&c.drawnW===c.canvas.clientWidth)continue;
    try{renderCard(c,t);c.drawn=1;c.drawnW=c.canvas.clientWidth}catch(e){console.error(e)}}first=false}
window.__STYLES={cards,scene,renderCard};
const go=()=>mount();if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(go);else go();
})();
</script>
